name: modamax_mobile
description: Aplicativo mobile do ModaMax integrado a API REST do sistema web.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
